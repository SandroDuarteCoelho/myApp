<ion-header [translucent]="true">
  <ion-toolbar>

    <ion-buttons slot="start">
      <ion-button
        class="info-btn"
        fill="clear"
        (click)="openCasasInfo()"
        aria-label="Informações das casas">
        ℹ
      </ion-button>
    </ion-buttons>

    <ion-title>
      {{ casaAtual }}
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- IMAGEM PRINCIPAL -->

  <div class="hero">

    <img
      [src]="backgroundImage"
      class="hero-image"
      alt="Casa">

    <div class="hero-overlay">

      <!-- <div class="hero-card">

        <div class="hero-title">
          {{ casaAtual }}
        </div>

        <div class="hero-description">
          {{ descricaoCasaAtual }}
        </div>

      </div> -->

      <div class="regra-wrapper">

    <div class="regra-container">

      <div class="quote-icon">
        
      </div>

      <div class="regra-text">
        {{ regraTexto }}
      </div>

      <ion-button
        fill="clear"
        size="small"
        class="regra-edit-btn"
        (click)="openRegraEdit()">

        ✏ Editar

      </ion-button>

    </div>

  </div>


    </div>

  </div>

  <!-- FRASE -->

  

  <!-- GRELHA -->

  <ion-grid>

    <ion-row>

      <ion-col size="6">

        <ion-card button (click)="navigatePrayer()">

          <ion-card-header>

            <div class="card-icon">
              🙏
            </div>

            <ion-card-title>
              Oração do Perdão
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>

      <ion-col size="6">

        <ion-card button (click)="navigatePerfil()">

          <ion-card-header>

            <div class="card-icon">
              👤
            </div>

            <ion-card-title>
              Perfil
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>

    </ion-row>

    <ion-row>

      <ion-col size="6">

        <ion-card button (click)="navigateAnimais()">

          <ion-card-header>

            <div class="card-icon">
              🦅
            </div>

            <ion-card-title>
              Animais
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>

      <ion-col size="6">

        <ion-card button (click)="navigateValores()">

          <ion-card-header>

            <div class="card-icon">
              💎
            </div>

            <ion-card-title>
              Valores
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>

    </ion-row>


    <ion-row>

      <ion-col size="6">

        <ion-card button (click)="navigateMeditacoes()">

          <ion-card-header>

            <div class="card-icon">
              🧘
            </div>

            <ion-card-title>
              Meditações
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>


      <ion-col size="6">

        <ion-card button (click)="navigateMetadeSombra()">

          <ion-card-header>

            <div class="card-icon">
              🌗
            </div>

            <ion-card-title>
              Metade sombra
            </ion-card-title>

          </ion-card-header>

        </ion-card>

      </ion-col>


    </ion-row>


  </ion-grid>



  <!-- MODAL EDITAR FRASE -->

  <ion-modal
    [isOpen]="isRegraEditModalOpen"
    (didDismiss)="closeRegraEdit()">

    <ng-template>


      <ion-header>

        <ion-toolbar>


          <ion-title>
            Editar frase
          </ion-title>


          <ion-buttons slot="end">


            <ion-button
              (click)="closeRegraEdit()">

              Cancelar

            </ion-button>


            <ion-button
              (click)="saveRegraEdit()">

              Guardar

            </ion-button>


          </ion-buttons>


        </ion-toolbar>

      </ion-header>



      <ion-content class="ion-padding">


        <ion-item>


          <ion-label position="stacked">

            Frase

          </ion-label>



          <ion-input

            [(ngModel)]="regraTextoEdit"

            placeholder="Digite a nova frase">

          </ion-input>


        </ion-item>


      </ion-content>


    </ng-template>


  </ion-modal>


  <!-- MODAL CASAS -->


  <ion-modal

    [isOpen]="isCasasModalOpen"

    (didDismiss)="isCasasModalOpen = false">


    <ng-template>


      <ion-header>


        <ion-toolbar>


          <ion-title>
            Casas
          </ion-title>



          <ion-buttons slot="end">


            <ion-button

              (click)="isCasasModalOpen = false">

              Fechar

            </ion-button>


          </ion-buttons>


        </ion-toolbar>


      </ion-header>




      <ion-content class="ion-padding">



        <ion-list>



          <ion-item

            *ngFor="let casa of casasList">



            <ion-label>



              <h2 class="casa-item-title">

                {{ casa.nome }}

              </h2>



              <p class="casa-item-desc">

                {{ casa.descricao }}

              </p>



            </ion-label>



          </ion-item>



        </ion-list>



      </ion-content>



    </ng-template>



  </ion-modal>



</ion-content>
