 <ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltar()">Voltar</ion-button>
    </ion-buttons>
    <ion-title>Qualidade de Vida</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="reflexoes-grid">
    <ion-card button="true" (click)="abrirReflexao('diaria')">
      <ion-card-content>
        <div class="cartao-icon">☀️</div>
        <h2>Reflexão Diária</h2>
      </ion-card-content>
    </ion-card>

    <ion-card button="true" (click)="abrirReflexao('semanal')">
      <ion-card-content>
        <div class="cartao-icon">🌿</div>
        <h2>Reflexão Semanal</h2>
      </ion-card-content>
    </ion-card>

    <ion-card button="true" (click)="abrirReflexao('mensal')">
      <ion-card-content>
        <div class="cartao-icon">🌱</div>
        <h2>Reflexão Mensal</h2>
      </ion-card-content>
    </ion-card>

    <ion-card button="true" (click)="abrirReflexao('anual')">
      <ion-card-content>
        <div class="cartao-icon">🌳</div>
        <h2>Reflexão Anual</h2>
      </ion-card-content>
    </ion-card>
  </div>

  <section class="animais-section">
    <div class="animais-titulo">
      <h2>Animal de estimação</h2>

      <ion-button
        class="botao-adicionar"
        shape="round"
        (click)="adicionarAnimal()"
        aria-label="Adicionar animal de estimação">
        +
      </ion-button>
    </div>

    <div class="animais-lista">
      <ion-card
  *ngFor="let animal of animais; let i = index"
  button="true"
  (click)="abrirAnimal(animal)">
        <ion-card-content>
          <div class="animal-item">
            <span>🐾</span>
            <strong>{{ animal.nome }}</strong>
            <ion-button
  fill="clear"
  color="danger"
  (click)="removerAnimal(i, $event)"
  aria-label="Remover animal">
  ✕
</ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </div>
  </section>

</ion-content>
