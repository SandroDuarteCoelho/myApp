<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="voltar()">Voltar</ion-button>
    </ion-buttons>
    <ion-title>{{ titulo }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>{{ titulo }}</h2>

  <p>
    Reserva um momento para refletir sobre a tua vida,
    as tuas escolhas, as tuas relações e aquilo que valorizas.
  </p>

  <ion-card>
    <ion-card-content>
      As perguntas desta reflexão serão acrescentadas aqui.
    </ion-card-content>
  </ion-card>
</ion-content>
