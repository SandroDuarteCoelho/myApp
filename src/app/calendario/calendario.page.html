<ion-header>
  <ion-toolbar class="calendario-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="voltar()">
        Voltar
      </ion-button>
    </ion-buttons>

    <ion-title>Calendário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="calendario-content">
  <div class="calendario-container">

    <div class="cabecalho-calendario">
      <h1 class="titulo-mes">{{ tituloMes }}</h1>

      <div class="navegacao-semana">
        <ion-button
          fill="clear"
          class="seta-semana"
          aria-label="Semana anterior"
          (click)="semanaAnterior()">
          ‹
        </ion-button>

        <div class="informacao-semana">
          <span class="periodo-semana">
            {{ periodoSemana }}
          </span>

          <span class="texto-semana">
            {{ textoSemana }}
          </span>
        </div>

        <ion-button
          fill="clear"
          class="seta-semana"
          aria-label="Semana seguinte"
          (click)="semanaSeguinte()">
          ›
        </ion-button>
      </div>

      <ion-button
        fill="outline"
        size="small"
        class="botao-semana-atual"
        (click)="irParaSemanaAtual()">
        Ir para hoje
      </ion-button>
    </div>

    <div class="dias-calendario">
      <button
        *ngFor="let dia of diasSemana"
        type="button"
        class="dia-botao"
        [class.dia-hoje]="dia.eHoje"
        [class.dia-fim-de-semana]="
          dia.nome === 'Sáb' || dia.nome === 'Dom'
        "
        (click)="abrirDia(dia)">

        <span class="dia-nome">{{ dia.nome }}</span>
        <span class="dia-numero">{{ dia.numero }}</span>

        <span class="dia-indicador">
          {{ dia.eHoje ? 'Hoje' : '\u00A0' }}
        </span>
      </button>
    </div>

    <div class="nota-calendario">
      <span class="ponto-legenda"></span>
      <span>
        Seleciona um dia para consultar ou organizar a agenda.
      </span>
    </div>

  </div>
</ion-content>
